server:
  port: 8082
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: portable,xucai
  application:
    name: xucai-user
xucai:
  swagger:
    enable: true
    enableResponseWrap: true
    title: 序采 · 用户与身份接口
    description: 办公设备选购与采购平台
    version: v1.0
  auth:
    resource:
      enable: false
      excludeLoginPaths:
      - /users/detail/{isStaff}
      - /users/list
      - GET:/users/{id}
      - /users/{id}/type
      - /users/ids
      - /users/me
  jdbc:
    database: xucai_user
  isolation-required: true
