# Local demo dependencies only. Run from the private directory generated by
# scripts/prepare_local_dependencies.py; all published ports bind loopback.
version: '3.8'
services:
  mysql:
    image: ${XUCAI_MYSQL_IMAGE:-mysql:8.0.29}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root
      MYSQL_ROOT_HOST: '%'
    ports:
      - '127.0.0.1:${XUCAI_MYSQL_PORT:-13306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-root:/run/secrets/mysql-root:ro
      - ./app-user.sql:/docker-entrypoint-initdb.d/01-app-user.sql:ro
    networks: [procurement]
    restart: unless-stopped
  nacos:
    image: ${XUCAI_NACOS_IMAGE:-nacos/nacos-server:v2.4.2}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - '127.0.0.1:${XUCAI_NACOS_PORT:-18848}:8848'
      - '127.0.0.1:${XUCAI_NACOS_GRPC_PORT:-19848}:9848'
    volumes:
      - nacos-data:/home/nacos/data
    networks: [procurement]
    restart: unless-stopped
  redis:
    image: ${XUCAI_REDIS_IMAGE:-redis/redis-stack:6.2.6-v19}
    ports:
      - '127.0.0.1:${XUCAI_REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
      - ./redis.conf:/redis-stack.conf:ro
    networks: [procurement]
    restart: unless-stopped
volumes:
  mysql-data:
  nacos-data:
  redis-data:
networks:
  procurement:
