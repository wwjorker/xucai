spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  config:
    import: classpath:xucai-isolation.yml
  cloud:
    loadbalancer:
      retry:
        enabled: false
    openfeign:
      client:
        config:
          assistantDraft:
            connectTimeout: 1500
            readTimeout: 2500
          candidateRun:
            connectTimeout: 1500
            readTimeout: 2500
          sale:
            connectTimeout: 1500
            readTimeout: 2500
          catalog:
            connectTimeout: 1500
            readTimeout: 2500
