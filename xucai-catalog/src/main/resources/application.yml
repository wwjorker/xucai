server:
  port: 8086
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: portable,xucai
  application:
    name: xucai-catalog
  main:
    allow-circular-references: true
xucai:
  swagger:
    enable: true
    enableResponseWrap: true
    title: 序采 · 商品目录接口
    description: 办公设备选购与采购平台
    version: v1.0
  auth:
    resource:
      enable: false
  jdbc:
    database: xucai_catalog
  isolation-required: true
